<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Property Tax Dashboard — 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ===== RESET & VARIABLES ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f172a;
  --bg-secondary:#1e293b;
  --bg-card:#1e293b;
  --bg-input:#0f172a;
  --bg-hover:#334155;
  --bg-sidebar:#0c1322;
  --border:#334155;
  --border-light:#475569;
  --text-primary:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --accent:#3b82f6;
  --accent-hover:#2563eb;
  --accent-glow:rgba(59,130,246,0.25);
  --green:#10b981;
  --green-bg:rgba(16,185,129,0.15);
  --red:#ef4444;
  --red-bg:rgba(239,68,68,0.15);
  --orange:#f59e0b;
  --orange-bg:rgba(245,158,11,0.15);
  --purple:#8b5cf6;
  --cyan:#06b6d4;
  --sidebar-w:260px;
  --header-h:64px;
  --radius:12px;
  --radius-sm:8px;
  --radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
  --transition:0.2s ease;
}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden}
#app{display:flex;height:100vh}
/* ===== SIDEBAR ===== */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform var(--transition)}
#sidebar .logo{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
#sidebar .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px}
#sidebar .logo-text{font-size:16px;font-weight:700;letter-spacing:-0.3px}
#sidebar .logo-text span{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px}
#sidebar nav{flex:1;overflow-y:auto;padding:12px 0}
#sidebar nav .section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:16px 24px 8px;font-weight:600}
#sidebar nav a{display:flex;align-items:center;gap:12px;padding:10px 24px;color:var(--text-secondary);text-decoration:none;font-size:14px;font-weight:500;transition:all var(--transition);border-left:3px solid transparent;cursor:pointer}
#sidebar nav a:hover{background:var(--bg-hover);color:var(--text-primary)}
#sidebar nav a.active{background:rgba(59,130,246,0.1);color:var(--accent);border-left-color:var(--accent)}
#sidebar nav a .nav-icon{width:20px;text-align:center;font-size:16px}
#sidebar .sidebar-footer{padding:16px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
/* ===== MAIN ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{height:var(--header-h);min-height:var(--header-h);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
#header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
#header .tax-year{font-size:13px;color:var(--accent);background:rgba(59,130,246,0.15);padding:6px 14px;border-radius:20px;font-weight:600}
#content{flex:1;overflow-y:auto;padding:32px}
/* ===== CARDS ===== */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-header h2{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.card-header h3{font-size:15px;font-weight:600;letter-spacing:-0.2px}
/* ===== STAT CARDS ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.stat-card .stat-icon{font-size:24px;margin-bottom:8px}
.stat-card .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:4px}
.stat-card .stat-value{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat-card .stat-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat-card.income .stat-value{color:var(--green)}
.stat-card.expense .stat-value{color:var(--red)}
.stat-card.net .stat-value{color:var(--accent)}
.stat-card.tax .stat-value{color:var(--orange)}
.stat-card.mileage .stat-value{color:var(--purple)}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 100%;opacity:0.05}
.stat-card.income::after{background:var(--green)}
.stat-card.expense::after{background:var(--red)}
.stat-card.net::after{background:var(--accent)}
.stat-card.tax::after{background:var(--orange)}
.stat-card.mileage::after{background:var(--purple)}
/* ===== CHARTS ===== */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;margin-bottom:24px}
.chart-container{position:relative;width:100%;aspect-ratio:16/10;max-height:380px}
.chart-container canvas{width:100%!important;height:100%!important}
.chart-container.wide{grid-column:1/-1;aspect-ratio:16/7;max-height:320px}
/* ===== TABLES ===== */
.table-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(59,130,246,0.04)}
.amount{font-weight:600;font-variant-numeric:tabular-nums}
.amount.positive{color:var(--green)}
.amount.negative{color:var(--red)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-schedule-e{background:rgba(59,130,246,0.2);color:var(--accent)}
.badge-4562{background:rgba(139,92,246,0.2);color:var(--purple)}
/* ===== FORMS ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid.col2{grid-template-columns:1fr 1fr}
.form-grid.col3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group select,.form-group textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:14px;font-family:inherit;transition:border-color var(--transition);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-group input[type="file"]{padding:8px}
.form-group textarea{resize:vertical;min-height:70px}
::placeholder{color:var(--text-muted)}
/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 16px var(--accent-glow)}
.btn-secondary{background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-xs{padding:3px 10px;font-size:11px}
.btn-icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-xs)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{margin-bottom:20px;font-size:20px}
.modal .form-grid{margin-bottom:20px}
.modal .btn-group{justify-content:flex-end}
/* ===== TABS ===== */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg-input);border-radius:var(--radius-sm);padding:4px;overflow-x:auto}
.tab-btn{padding:8px 18px;border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--radius-xs);white-space:nowrap;transition:all var(--transition);font-family:inherit}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover:not(.active){color:var(--text-primary)}
/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:18px;color:var(--text-secondary);margin-bottom:8px}
.empty-state p{max-width:400px;margin:0 auto 20px;font-size:14px;line-height:1.6}
/* ===== PILL ===== */
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.pill-income{background:var(--green-bg);color:var(--green)}
.pill-expense{background:var(--red-bg);color:var(--red)}
.pill-mileage{background:rgba(139,92,246,0.2);color:var(--purple)}
/* ===== FILTER ROW ===== */
.filter-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-row select,.filter-row input{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none}
.filter-row select:focus,.filter-row input:focus{border-color:var(--accent)}
/* ===== UTILITY ===== */
.hidden{display:none!important}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-sm{gap:8px}
.mt-sm{margin-top:12px}
.mt-md{margin-top:20px}
.mb-sm{margin-bottom:12px}
.mb-md{margin-bottom:20px}
.text-muted{color:var(--text-muted);font-size:13px}
.text-sm{font-size:13px}
.text-center{text-align:center}
.w-full{width:100%}
/* ===== MOBILE ===== */
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #header{padding:0 16px}
  #content{padding:16px}
  .chart-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid.col2,.form-grid.col3{grid-template-columns:1fr}
  .mobile-menu-btn{display:flex!important}
}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--text-primary);font-size:24px;cursor:pointer;padding:4px}
/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}
/* ===== PAGINATION ===== */
.pagination{display:flex;gap:4px;justify-content:center;margin-top:16px}
.pagination button{padding:6px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text-secondary);cursor:pointer;font-size:12px;font-family:inherit}
.pagination button.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* ===== PRINT ===== */
@media print{
  #sidebar,#header,.btn,.tabs,.filter-row,.modal-overlay{display:none!important}
  #main{overflow:visible}
  #content{padding:0}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
<!-- ===== SIDEBAR ===== -->
<aside id="sidebar">
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div class="logo-text">RentalTracker<span>Tax Year 2026</span></div>
  </div>
  <nav>
    <div class="section-label">Overview</div>
    <a data-page="dashboard" class="active" onclick="navigate('dashboard')">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <div class="section-label">Data Entry</div>
    <a data-page="properties" onclick="navigate('properties')">
      <span class="nav-icon">🏘️</span> Properties
    </a>
    <a data-page="income" onclick="navigate('income')">
      <span class="nav-icon">💰</span> Income
    </a>
    <a data-page="expenses" onclick="navigate('expenses')">
      <span class="nav-icon">🧾</span> Expenses
    </a>
    <a data-page="mileage" onclick="navigate('mileage')">
      <span class="nav-icon">🚗</span> Mileage Log
    </a>
    <a data-page="assets" onclick="navigate('assets')">
      <span class="nav-icon">🏗️</span> Assets &amp; Depreciation
    </a>
    <div class="section-label">Reports</div>
    <a data-page="reports" onclick="navigate('reports')">
      <span class="nav-icon">📋</span> Tax Reports
    </a>
    <a data-page="export" onclick="navigate('export')">
      <span class="nav-icon">📥</span> Import / Export
    </a>
  </nav>
  <div class="sidebar-footer">2026 Standard Mileage: $0.70/mi</div>
</aside>
<!-- ===== MAIN ===== -->
<main id="main">
  <header id="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 id="page-title">Dashboard</h1>
    </div>
    <div class="tax-year">📅 Tax Year 2026</div>
  </header>
  <div id="content"></div>
</main>
</div>
<!-- ===== MODAL CONTAINER ===== -->
<div id="modal-container"></div>

<script>
// ===== DATA LAYER =====
const STORAGE_KEYS = {
  properties: 'rtd_properties',
  income: 'rtd_income',
  expenses: 'rtd_expenses',
  mileage: 'rtd_mileage',
  assets: 'rtd_assets'
};

const MILEAGE_RATE = 0.70;

const EXPENSE_CATEGORIES = [
  {id:'mortgage_interest',label:'Mortgage Interest',irs:'Schedule E - Line 12'},
  {id:'property_tax',label:'Property Tax',irs:'Schedule E - Line 16'},
  {id:'insurance',label:'Insurance',irs:'Schedule E - Line 15'},
  {id:'repairs_maintenance',label:'Repairs & Maintenance',irs:'Schedule E - Line 14'},
  {id:'utilities',label:'Utilities',irs:'Schedule E - Line 17'},
  {id:'management_fees',label:'Property Management Fees',irs:'Schedule E - Line 10'},
  {id:'advertising',label:'Advertising',irs:'Schedule E - Line 8'},
  {id:'travel',label:'Travel',irs:'Schedule E - Line 9'},
  {id:'legal_professional',label:'Legal & Professional',irs:'Schedule E - Line 11'},
  {id:'depreciation',label:'Depreciation',irs:'Form 4562'},
  {id:'hoa_fees',label:'HOA Fees',irs:'Schedule E - Line 18'},
  {id:'supplies',label:'Supplies',irs:'Schedule E - Line 19'},
  {id:'other',label:'Other',irs:'Schedule E - Line 19'}
];

const INCOME_TYPES = ['Rent', 'Security Deposit', 'Late Fee', 'Pet Fee', 'Parking Fee', 'Laundry Income', 'Other Income'];

function loadData(key){try{const d=localStorage.getItem(key);return d?JSON.parse(d):[]}catch(e){return[]}}
function saveData(key,data){localStorage.setItem(key,JSON.stringify(data))}

let currentPage = 'dashboard';
let chartInstances = {};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

// ===== NAVIGATION =====
function navigate(page){
  currentPage = page;
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.remove('active'));
  const link = document.querySelector(`#sidebar nav a[data-page="${page}"]`);
  if(link) link.classList.add('active');
  document.getElementById('page-title').textContent = link?link.textContent.trim():page.charAt(0).toUpperCase()+page.slice(1);
  document.getElementById('content').scrollTop = 0;
  destroyCharts();
  renderPage(page);
  if(window.innerWidth<768) document.getElementById('sidebar').classList.remove('open');
}

function destroyCharts(){
  Object.values(chartInstances).forEach(c=>{try{c.destroy()}catch(e){}});
  chartInstances={};
}

// ===== RENDER ENGINE =====
function renderPage(page){
  const c = document.getElementById('content');
  switch(page){
    case 'dashboard':
      const dashData = getDashboardData();
      c.innerHTML = renderDashboard(dashData);
      window._dashboardData = dashData;
      initDashboardCharts();
      break;
    case 'properties': c.innerHTML = renderProperties(); break;
    case 'income': c.innerHTML = renderIncome(); initIncomeHandlers(); break;
    case 'expenses': c.innerHTML = renderExpenses(); initExpenseHandlers(); break;
    case 'mileage': c.innerHTML = renderMileage(); initMileageHandlers(); break;
    case 'assets': c.innerHTML = renderAssets(); initAssetHandlers(); break;
    case 'reports': c.innerHTML = renderReports(); break;
    case 'export': c.innerHTML = renderExport(); break;
  }
}

// ===== DASHBOARD =====
function getDashboardData(){
  const props = loadData(STORAGE_KEYS.properties);
  const income = loadData(STORAGE_KEYS.income);
  const expenses = loadData(STORAGE_KEYS.expenses);
  const mileage = loadData(STORAGE_KEYS.mileage);

  const year = 2026;
  const yearIncome = income.filter(i=>new Date(i.date).getFullYear()===year);
  const yearExpenses = expenses.filter(e=>new Date(e.date).getFullYear()===year);
  const yearMileage = mileage.filter(m=>new Date(m.date).getFullYear()===year);

  const totalIncome = yearIncome.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const totalExpenses = yearExpenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const totalMileage = yearMileage.reduce((s,m)=>s+(parseFloat(m.miles)||0),0);
  const mileageDeduction = totalMileage * MILEAGE_RATE;
  const netIncome = totalIncome - totalExpenses - mileageDeduction;
  const estTax = Math.max(0, netIncome * 0.30);

  const expByCat = {};
  yearExpenses.forEach(e=>{
    const cat = (e.category||'other');
    expByCat[cat] = (expByCat[cat]||0)+(parseFloat(e.amount)||0);
  });
  const catLabels = Object.keys(expByCat).map(k=>{
    const ec = EXPENSE_CATEGORIES.find(c=>c.id===k);
    return ec?ec.label:k;
  });
  const catValues = Object.values(expByCat);

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthlyIncome = new Array(12).fill(0);
  const monthlyExpenses = new Array(12).fill(0);
  yearIncome.forEach(i=>{const m=new Date(i.date).getMonth();if(m>=0&&m<12)monthlyIncome[m]+=(parseFloat(i.amount)||0)});
  yearExpenses.forEach(e=>{const m=new Date(e.date).getMonth();if(m>=0&&m<12)monthlyExpenses[m]+=(parseFloat(e.amount)||0)});

  return {
    totalIncome, totalExpenses, totalMileage, mileageDeduction, netIncome, estTax,
    yearIncome, yearExpenses, yearMileage,
    expByCat, catLabels, catValues,
    months, monthlyIncome, monthlyExpenses,
    income: income, expenses: expenses, mileage: mileage
  };
}

function renderDashboard(d){
  const fmt = n=>'$'+Math.round(n).toLocaleString();

  return `
  <div class="stat-grid">
    <div class="stat-card income">
      <div class="stat-icon">💰</div>
      <div class="stat-label">Gross Rental Income</div>
      <div class="stat-value">${fmt(d.totalIncome)}</div>
      <div class="stat-sub">${d.yearIncome.length} entries</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-icon">🧾</div>
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value">${fmt(d.totalExpenses)}</div>
      <div class="stat-sub">${d.yearExpenses.length} entries</div>
    </div>
    <div class="stat-card mileage">
      <div class="stat-icon">🚗</div>
      <div class="stat-label">Mileage Deduction</div>
      <div class="stat-value">${fmt(d.mileageDeduction)}</div>
      <div class="stat-sub">${d.totalMileage.toLocaleString()} miles @ $${MILEAGE_RATE.toFixed(2)}/mi</div>
    </div>
    <div class="stat-card net">
      <div class="stat-icon">📈</div>
      <div class="stat-label">Net Income (YTD)</div>
      <div class="stat-value">${fmt(d.netIncome)}</div>
      <div class="stat-sub">${d.netIncome>=0?'Positive cash flow':'Negative cash flow'}</div>
    </div>
    <div class="stat-card tax">
      <div class="stat-icon">🏛️</div>
      <div class="stat-label">Est. Tax Liability</div>
      <div class="stat-value">${fmt(d.estTax)}</div>
      <div class="stat-sub">~30% effective rate estimate</div>
    </div>
  </div>
  <div class="chart-grid">
    <div class="card">
      <div class="card-header"><h3>📊 Income vs Expenses (Monthly)</h3></div>
      <div class="chart-container"><canvas id="chart-monthly"></canvas></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>🥧 Expenses by Category</h3></div>
      <div class="chart-container"><canvas id="chart-pie"></canvas></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><h3>📋 Recent Activity</h3></div>
    ${renderRecentActivity(d.income,d.expenses,d.mileage)}
  </div>`;
}

    address,
    propertyType: document.getElementById('prop-type').value,
    purchaseDate: document.getElementById('prop-date').value,
    purchasePrice: document.getElementById('prop-price').value
  };
  if(id){

  saveData(STORAGE_KEYS.properties,props);
  closeModal();
  renderPage('properties');

function deleteProperty(id){
  if(!confirm('Delete this property and all associated income, expenses, and assets? This cannot be undone.')) return;
  let props = loadData(STORAGE_KEYS.properties);
  props = props.filter(p=>p.id!==id);
  saveData(STORAGE_KEYS.properties,props);
  // Also remove related records
  ['income','expenses','assets'].forEach(k=>{
    let data = loadData(STORAGE_KEYS[k]);
    if(k==='assets'){
      data = data.filter(d=>d.propertyId!==id);
    }else{
      data = data.filter(d=>d.propertyId!==id);
    }
    saveData(STORAGE_KEYS[k],data);
  });
  renderPage('properties');
}

  reader.readAsDataURL(file);
}

function saveMileage(id){
  const date = document.getElementById('ml-date').value;
  const purpose = document.getElementById('ml-purpose').value.trim();
  const miles = document.getElementById('ml-miles').value;
  if(!date||!purpose||!miles){alert('Please fill in all required fields.');return}
  const mileage = loadData(STORAGE_KEYS.mileage);
  const data = {
    id: id||uid(),
    date, purpose,
    startOdo: document.getElementById('ml-start').value||'',
    endOdo: document.getElementById('ml-end').value||'',
    miles: parseFloat(miles),
    rate: MILEAGE_RATE
  };
  if(id){
    const idx = mileage.findIndex(m=>m.id===id);
    if(idx>=0) mileage[idx]=data;
  }else{
    mileage.push(data);
  }
  saveData(STORAGE_KEYS.mileage,mileage);
  closeModal();
  renderPage('mileage');
}

function deleteMileage(id){
  if(!confirm('Delete this mileage entry?')) return;
  let mileage = loadData(STORAGE_KEYS.mileage);
  mileage = mileage.filter(m=>m.id!==id);
  saveData(STORAGE_KEYS.mileage,mileage);
  renderPage('mileage');
}
