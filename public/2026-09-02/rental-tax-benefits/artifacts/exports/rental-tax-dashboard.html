<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Property Tax Dashboard — 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f172a;--bg-secondary:#1e293b;--bg-card:#1e293b;--bg-input:#0f172a;
  --bg-hover:#334155;--bg-sidebar:#0c1322;
  --border:#334155;--border-light:#475569;
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-glow:rgba(59,130,246,0.25);
  --green:#10b981;--red:#ef4444;--orange:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;
  --sidebar-w:260px;--header-h:64px;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);--transition:0.2s ease;
}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden}
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform var(--transition)}
#sidebar .logo{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
#sidebar .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px}
#sidebar .logo-text{font-size:16px;font-weight:700;letter-spacing:-0.3px}
#sidebar .logo-text span{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px}
#sidebar nav{flex:1;overflow-y:auto;padding:12px 0}
#sidebar nav .section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:16px 24px 8px;font-weight:600}
#sidebar nav a{display:flex;align-items:center;gap:12px;padding:10px 24px;color:var(--text-secondary);text-decoration:none;font-size:14px;font-weight:500;transition:all var(--transition);border-left:3px solid transparent;cursor:pointer}
#sidebar nav a:hover{background:var(--bg-hover);color:var(--text-primary)}
#sidebar nav a.active{background:rgba(59,130,246,0.1);color:var(--accent);border-left-color:var(--accent)}
#sidebar nav a .nav-icon{width:20px;text-align:center;font-size:16px}
#sidebar .sidebar-footer{padding:16px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{height:var(--header-h);min-height:var(--header-h);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
#header h1{font-size:20px;font-weight:700;letter-spacing:-0.3px}
#header .tax-year{font-size:13px;color:var(--accent);background:rgba(59,130,246,0.15);padding:6px 14px;border-radius:20px;font-weight:600}
#content{flex:1;overflow-y:auto;padding:32px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card-header h2{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.card-header h3{font-size:15px;font-weight:600;letter-spacing:-0.2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.stat-card .stat-icon{font-size:24px;margin-bottom:8px}
.stat-card .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:4px}
.stat-card .stat-value{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat-card .stat-sub{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat-card.income .stat-value{color:var(--green)}
.stat-card.expense .stat-value{color:var(--red)}
.stat-card.net .stat-value{color:var(--accent)}
.stat-card.tax .stat-value{color:var(--orange)}
.stat-card.mileage .stat-value{color:var(--purple)}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 0 0 100%;opacity:0.05}
.stat-card.income::after{background:var(--green)}
.stat-card.expense::after{background:var(--red)}
.stat-card.net::after{background:var(--accent)}
.stat-card.tax::after{background:var(--orange)}
.stat-card.mileage::after{background:var(--purple)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:24px;margin-bottom:24px}
.chart-container{position:relative;width:100%;aspect-ratio:16/10;max-height:380px}
.chart-container canvas{width:100%!important;height:100%!important}
.chart-container.wide{grid-column:1/-1;aspect-ratio:16/7;max-height:320px}
.table-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(59,130,246,0.04)}
.amount{font-weight:600;font-variant-numeric:tabular-nums}
.amount.positive{color:var(--green)}
.amount.negative{color:var(--red)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-schedule-e{background:rgba(59,130,246,0.2);color:var(--accent)}
.badge-4562{background:rgba(139,92,246,0.2);color:var(--purple)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.form-grid.col2{grid-template-columns:1fr 1fr}
.form-grid.col3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group select,.form-group textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:14px;font-family:inherit;transition:border-color var(--transition);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-group textarea{resize:vertical;min-height:70px}
::placeholder{color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition);font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 4px 16px var(--accent-glow)}
.btn-secondary{background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-xs{padding:3px 10px;font-size:11px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:90%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{margin-bottom:20px;font-size:20px}
.modal .btn-group{justify-content:flex-end}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg-input);border-radius:var(--radius-sm);padding:4px;overflow-x:auto}
.tab-btn{padding:8px 18px;border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--radius-xs);white-space:nowrap;transition:all var(--transition);font-family:inherit}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover:not(.active){color:var(--text-primary)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:56px;margin-bottom:16px;opacity:0.5}
.empty-state h3{font-size:18px;color:var(--text-secondary);margin-bottom:8px}
.empty-state p{max-width:400px;margin:0 auto 20px;font-size:14px;line-height:1.6}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.pill-income{background:rgba(16,185,129,0.15);color:var(--green)}
.pill-expense{background:rgba(239,68,68,0.15);color:var(--red)}
.pill-mileage{background:rgba(139,92,246,0.2);color:var(--purple)}
.filter-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-row select,.filter-row input{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none}
.filter-row select:focus,.filter-row input:focus{border-color:var(--accent)}
.hidden{display:none!important}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt-sm{margin-top:12px}.mt-md{margin-top:20px}.mb-sm{margin-bottom:12px}.mb-md{margin-bottom:20px}
.text-muted{color:var(--text-muted);font-size:13px}.text-sm{font-size:13px}.text-center{text-align:center}
.mobile-menu-btn{display:none!important}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #header{padding:0 16px}#content{padding:16px}
  .chart-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid.col2,.form-grid.col3{grid-template-columns:1fr}
  .mobile-menu-btn{display:flex!important}
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}
@media print{
  #sidebar,#header,.btn,.tabs,.filter-row,.modal-overlay{display:none!important}
  #main{overflow:visible}#content{padding:0}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <div class="logo-text">RentalTracker<span>Tax Year 2026</span></div>
  </div>
  <nav>
    <div class="section-label">Overview</div>
    <a data-page="dashboard" class="active" onclick="navigate('dashboard')"><span class="nav-icon">📊</span> Dashboard</a>
    <div class="section-label">Data Entry</div>
    <a data-page="properties" onclick="navigate('properties')"><span class="nav-icon">🏘️</span> Properties</a>
    <a data-page="income" onclick="navigate('income')"><span class="nav-icon">💰</span> Income</a>
    <a data-page="expenses" onclick="navigate('expenses')"><span class="nav-icon">🧾</span> Expenses</a>
    <a data-page="mileage" onclick="navigate('mileage')"><span class="nav-icon">🚗</span> Mileage Log</a>
    <a data-page="assets" onclick="navigate('assets')"><span class="nav-icon">🏗️</span> Assets &amp; Depreciation</a>
    <div class="section-label">Reports</div>
    <a data-page="reports" onclick="navigate('reports')"><span class="nav-icon">📋</span> Tax Reports</a>
    <a data-page="export" onclick="navigate('export')"><span class="nav-icon">📥</span> Import / Export</a>
  </nav>
  <div class="sidebar-footer">2026 Standard Mileage: $0.70/mi</div>
</aside>
<main id="main">
  <header id="header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 id="page-title">Dashboard</h1>
    </div>
    <div class="tax-year">📅 Tax Year 2026</div>
  </header>
  <div id="content"></div>
</main>
</div>
<div id="modal-container"></div>

<script>
/* ================================================================
   Rental Property Tax Dashboard — Complete Application
   All data persisted in localStorage. No backend required.
   ================================================================ */

var STORAGE_KEYS = {
  properties: 'rtd_properties',
  income: 'rtd_income',
  expenses: 'rtd_expenses',
  mileage: 'rtd_mileage',
  assets: 'rtd_assets'
};

var MILEAGE_RATE = 0.70;

var EXPENSE_CATEGORIES = [
  {id:'mortgage_interest',label:'Mortgage Interest',irs:'Schedule E - Line 12'},
  {id:'property_tax',label:'Property Tax',irs:'Schedule E - Line 16'},
  {id:'insurance',label:'Insurance',irs:'Schedule E - Line 15'},
  {id:'repairs_maintenance',label:'Repairs & Maintenance',irs:'Schedule E - Line 14'},
  {id:'utilities',label:'Utilities',irs:'Schedule E - Line 17'},
  {id:'management_fees',label:'Property Management Fees',irs:'Schedule E - Line 10'},
  {id:'advertising',label:'Advertising',irs:'Schedule E - Line 8'},
  {id:'travel',label:'Travel',irs:'Schedule E - Line 9'},
  {id:'legal_professional',label:'Legal & Professional',irs:'Schedule E - Line 11'},
  {id:'depreciation',label:'Depreciation',irs:'Form 4562'},
  {id:'hoa_fees',label:'HOA Fees',irs:'Schedule E - Line 18'},
  {id:'supplies',label:'Supplies',irs:'Schedule E - Line 19'},
  {id:'other',label:'Other',irs:'Schedule E - Line 19'}
];

var INCOME_TYPES = ['Rent','Security Deposit','Late Fee','Pet Fee','Parking Fee','Laundry Income','Other Income'];

var currentPage = 'dashboard';
var chartInstances = {};

function loadData(key){ try{ var d=localStorage.getItem(key); return d?JSON.parse(d):[]; }catch(e){ return[]; } }
function saveData(key,data){ localStorage.setItem(key,JSON.stringify(data)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---- Helpers ---- */
function esc(str){ if(!str)return''; var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escAttr(str){ if(!str)return''; return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function closeModal(){ document.getElementById('modal-container').innerHTML=''; }
function downloadBlob(blob,filename){
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function fmtCurrency(n){ return '$'+Math.round(n).toLocaleString(); }

/* ---- Navigation ---- */
function navigate(page){
  currentPage = page;
  var links = document.querySelectorAll('#sidebar nav a');
  for(var i=0;i<links.length;i++) links[i].classList.remove('active');
  var link = document.querySelector('#sidebar nav a[data-page="'+page+'"]');
  if(link) link.classList.add('active');
  document.getElementById('page-title').textContent = link?link.textContent.trim():page;
  document.getElementById('content').scrollTop = 0;
  destroyCharts();
  renderPage(page);
  if(window.innerWidth<768) document.getElementById('sidebar').classList.remove('open');
}

function destroyCharts(){
  for(var k in chartInstances){ try{chartInstances[k].destroy();}catch(e){} }
  chartInstances = {};
}

/* ---- Page Dispatcher ---- */
function renderPage(page){
  var c = document.getElementById('content');
  switch(page){
    case 'dashboard': renderDashboard(); break;
    case 'properties': renderProperties(); break;
    case 'income': renderIncome(); break;
    case 'expenses': renderExpenses(); break;
    case 'mileage': renderMileage(); break;
    case 'assets': renderAssets(); break;
    case 'reports': renderReports(); break;
    case 'export': renderExport(); break;
  }
}

/* =================================================================
   DASHBOARD
   ================================================================= */
function getDashboardData(){
  var income=loadData(STORAGE_KEYS.income), expenses=loadData(STORAGE_KEYS.expenses);
  var mileage=loadData(STORAGE_KEYS.mileage);
  var y=2026;
  var yi=income.filter(function(i){return new Date(i.date).getFullYear()===y;});
  var ye=expenses.filter(function(e){return new Date(e.date).getFullYear()===y;});
  var ym=mileage.filter(function(m){return new Date(m.date).getFullYear()===y;});
  var ti=yi.reduce(function(s,i){return s+(parseFloat(i.amount)||0);},0);
  var te=ye.reduce(function(s,e){return s+(parseFloat(e.amount)||0);},0);
  var tm=ym.reduce(function(s,m){return s+(parseFloat(m.miles)||0);},0);
  var md=tm*MILEAGE_RATE, ni=ti-te-md, et=Math.max(0,ni*0.30);
  var ec={};
  ye.forEach(function(e){ var c=e.category||'other'; ec[c]=(ec[c]||0)+(parseFloat(e.amount)||0); });
  var cl=[],cv=[];
  for(var k in ec){
    var cat=EXPENSE_CATEGORIES.find(function(x){return x.id===k;});
    cl.push(cat?cat.label:k); cv.push(ec[k]);
  }
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var mi=new Array(12).fill(0), me=new Array(12).fill(0);
  yi.forEach(function(i){var m=new Date(i.date).getMonth();if(m>=0&&m<12)mi[m]+=(parseFloat(i.amount)||0);});
  ye.forEach(function(e){var m=new Date(e.date).getMonth();if(m>=0&&m<12)me[m]+=(parseFloat(e.amount)||0);});
  return {ti:ti,te:te,tm:tm,md:md,ni:ni,et:et,yi:yi,ye:ye,ym:ym,ec:ec,cl:cl,cv:cv,mo:mo,mi:mi,me:me};
}

function renderDashboard(){
  var d=getDashboardData(), f=fmtCurrency;
  window._dashData = d;
  var h='';
  h+='<div class="stat-grid">';
  h+='<div class="stat-card income"><div class="stat-icon">💰</div><div class="stat-label">Gross Rental Income</div><div class="stat-value">'+f(d.ti)+'</div><div class="stat-sub">'+d.yi.length+' entries</div></div>';
  h+='<div class="stat-card expense"><div class="stat-icon">🧾</div><div class="stat-label">Total Expenses</div><div class="stat-value">'+f(d.te)+'</div><div class="stat-sub">'+d.ye.length+' entries</div></div>';
  h+='<div class="stat-card mileage"><div class="stat-icon">🚗</div><div class="stat-label">Mileage Deduction</div><div class="stat-value">'+f(d.md)+'</div><div class="stat-sub">'+d.tm.toLocaleString()+' miles @ $'+MILEAGE_RATE.toFixed(2)+'/mi</div></div>';
  h+='<div class="stat-card net"><div class="stat-icon">📈</div><div class="stat-label">Net Income (YTD)</div><div class="stat-value">'+f(d.ni)+'</div><div class="stat-sub">'+(d.ni>=0?'Positive cash flow':'Negative cash flow')+'</div></div>';
  h+='<div class="stat-card tax"><div class="stat-icon">🏛️</div><div class="stat-label">Est. Tax Liability</div><div class="stat-value">'+f(d.et)+'</div><div class="stat-sub">~30% effective rate estimate</div></div>';
  h+='</div>';
  h+='<div class="chart-grid">';
  h+='<div class="card"><div class="card-header"><h3>📊 Income vs Expenses (Monthly)</h3></div><div class="chart-container"><canvas id="chart-monthly"></canvas></div></div>';
  h+='<div class="card"><div class="card-header"><h3>🥧 Expenses by Category</h3></div><div class="chart-container"><canvas id="chart-pie"></canvas></div></div>';
  h+='</div>';
  h+='<div class="card"><div class="card-header"><h3>📋 Recent Activity</h3></div>'+renderRecentActivity(loadData(STORAGE_KEYS.income),loadData(STORAGE_KEYS.expenses),loadData(STORAGE_KEYS.mileage))+'</div>';
  document.getElementById('content').innerHTML = h;
  initDashboardCharts();
}

function renderRecentActivity(income,expenses,mileage){
  var all=[],i;
  for(i=0;i<income.length;i++) all.push({date:income[i].date,type:'income',label:'Income: '+(income[i].type||'Rent'),prop:income[i].propertyName||income[i].propertyId||'',amount:(parseFloat(income[i].amount)||0).toFixed(2)});
  for(i=0;i<expenses.length;i++){ var ec=EXPENSE_CATEGORIES.find(function(c){return c.id===expenses[i].category;}); all.push({date:expenses[i].date,type:'expense',label:'Expense: '+(ec?ec.label:expenses[i].category||'Other'),prop:expenses[i].propertyName||expenses[i].propertyId||'',amount:(parseFloat(expenses[i].amount)||0).toFixed(2)});}
  for(i=0;i<mileage.length;i++) all.push({date:mileage[i].date,type:'mileage',label:'Mileage: '+(mileage[i].miles||0)+' mi',prop:'',amount:((parseFloat(mileage[i].miles)||0)*MILEAGE_RATE).toFixed(2)});
  all.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var recent=all.slice(0,15);
  if(!recent.length) return '<div class="empty-state"><div class="empty-icon">📭</div><h3>No activity yet</h3><p>Start adding income, expenses, and mileage.</p></div>';
  var rows='';
  for(i=0;i<recent.length;i++){
    var r=recent[i], cls=r.type==='income'?'positive':(r.type==='expense'?'negative':''), pill=r.type==='income'?'pill-income':(r.type==='expense'?'pill-expense':'pill-mileage');
    rows+='<tr><td>'+new Date(r.date).toLocaleDateString()+'</td><td><span class="pill '+pill+'">'+r.type+'</span></td><td>'+esc(r.label)+'</td><td class="text-muted">'+esc(r.prop||'—')+'</td><td class="amount '+cls+'">'+(r.type==='mileage'?'':'$')+r.amount+'</td></tr>';
  }

  mc.innerHTML+='<div class="form-group"><label>Starting Odometer</label><input type="number" id="fm-start" placeholder="50000" value="'+(m?m.startOdo:'')+'" min="0"></div>';
  mc.innerHTML+='<div class="form-group"><label>Ending Odometer</label><input type="number" id="fm-end" placeholder="50025" value="'+(m?m.endOdo:'')+'" min="0" onchange="autoCalcMiles()"></div>';

function autoCalcMiles(){
  var s=parseFloat(document.getElementById('fm-start').value)||0, e=parseFloat(document.getElementById('fm-end').value)||0;
  if(s>0&&e>s) document.getElementById('fm-miles').value=(e-s).toFixed(1);
}

function saveMileage(id){
  var date=document.getElementById('fm-date').value, purpose=document.getElementById('fm-purpose').value.trim(), miles=document.getElementById('fm-miles').value;
  if(!date||!purpose||!miles){alert('Please fill in all required fields.');return;}
  var mileage=loadData(STORAGE_KEYS.mileage);
  var data={id:id||uid(),date:date,purpose:purpose,startOdo:document.getElementById('fm-start').value||'',endOdo:document.getElementById('fm-end').value||'',miles:parseFloat(miles),rate:MILEAGE_RATE};
  if(id){var idx=mileage.findIndex(function(m){return m.id===id;}); if(idx>=0) mileage[idx]=data;}
  else mileage.push(data);
  saveData(STORAGE_KEYS.mileage,mileage); closeModal(); renderMileage();
}

function deleteMileage(id){
  if(!confirm('Delete this mileage entry?')) return;
  saveData(STORAGE_KEYS.mileage,loadData(STORAGE_KEYS.mileage).filter(function(m){return m.id!==id;}));
  renderMileage();
}
